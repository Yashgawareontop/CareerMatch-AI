name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build only needs a syntactically valid URL; nothing is fetched.
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs the real app against a test Convex deployment and real AI keys.
    # Add these repository secrets to enable it; without them it is skipped:
    #   CONVEX_DEPLOY_KEY      deploy key of a dedicated test deployment
    #   NEXT_PUBLIC_CONVEX_URL that deployment's URL
    #   RESUME_PARSER_SECRET   same value as set on that deployment
    #   GROQ_API_KEY, GEMINI_API_KEY
    env:
      HAS_SECRETS: ${{ secrets.CONVEX_DEPLOY_KEY != '' && secrets.NEXT_PUBLIC_CONVEX_URL != '' }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      RESUME_PARSER_SECRET: ${{ secrets.RESUME_PARSER_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Skip without test secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::E2E secrets not configured; skipping the end-to-end test."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_SECRETS == 'true'
      - name: Push functions to the test deployment
        if: env.HAS_SECRETS == 'true'
        run: npx convex deploy --yes
      - run: pnpm build
        if: env.HAS_SECRETS == 'true'
      - run: npx playwright install --with-deps chromium
        if: env.HAS_SECRETS == 'true'
      - run: pnpm test:e2e
        if: env.HAS_SECRETS == 'true'
      - uses: actions/upload-artifact@v4
        if: failure() && env.HAS_SECRETS == 'true'
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
